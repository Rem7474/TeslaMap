services:
  teslamap:
    image: teslamap:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_PATH=/data/teslamap.db
      - MQTT_BROKER=tcp://mosquitto:1883
      - TESLAMATE_CAR_ID=1
      - ADMIN_PASSWORD=ChangeMeStrongPassword!
      - ROUTING_PROVIDER=openrouteservice # openrouteservice, mapbox, or osrm
      - ROUTING_API_KEY=votre_cle_api_openrouteservice # ou clé Mapbox (pk.xxx)
      - MAP_PROVIDER=cartodb # cartodb (gratuit sans clé), mapbox, maptiler, stadia
      - MAP_API_KEY= # Optionnel: clé Mapbox (pk.xxx), MapTiler ou Stadia
      # - MAP_TILE_URL= # Optionnel: URL de tuiles personnalisée
      - SIMULATION_MODE=false # passer à true pour tester sans voiture
    volumes:
      - teslamap-data:/data
    networks:
      - default

volumes:
  teslamap-data:

# Si vous l'intégrez dans un docker-compose séparé de TeslaMate,
# connectez-vous au réseau existant de TeslaMate :
# networks:
#   default:
#     external:
#       name: teslamate_default
