name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run unit tests with race detector
        run: go test -v -race ./...

      - name: Verify Linux build
        run: CGO_ENABLED=0 GOOS=linux go build -v ./cmd/teslamap

      - name: Verify Windows build
        run: CGO_ENABLED=0 GOOS=windows go build -v ./cmd/teslamap
