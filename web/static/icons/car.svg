<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Directional headlight beam glow -->
    <radialGradient id="beamGlow" cx="50%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Headlight beam pointing UP (north = 0 deg) -->
  <polygon points="18,14 4,0 44,0 30,14" fill="url(#beamGlow)" />

  <!-- Outer pulse ring -->
  <circle cx="24" cy="26" r="19" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2,2" />

  <!-- Car body -->
  <g filter="url(#shadow)">
    <!-- Base chassis -->
    <rect x="15" y="12" width="18" height="28" rx="8" fill="#1e2229" stroke="#e82127" stroke-width="2"/>
    <!-- Windshield -->
    <path d="M17 21 C17 19, 31 19, 31 21 L30 26 C30 27, 18 27, 18 26 Z" fill="#60a5fa" opacity="0.85"/>
    <!-- Glass roof -->
    <rect x="18" y="27" width="12" height="7" rx="2" fill="#2563eb" opacity="0.6"/>
    <!-- Rear glass -->
    <rect x="18" y="35" width="12" height="2.5" rx="1" fill="#60a5fa" opacity="0.7"/>
    <!-- Headlights -->
    <circle cx="17.5" cy="13.5" r="1.5" fill="#ffffff" />
    <circle cx="30.5" cy="13.5" r="1.5" fill="#ffffff" />
    <!-- Taillights -->
    <rect x="16.5" y="39.5" width="3" height="1" rx="0.5" fill="#ef4444" />
    <rect x="28.5" y="39.5" width="3" height="1" rx="0.5" fill="#ef4444" />
  </g>
</svg>
