<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Live Map - Admin</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- TeslaMap Styles -->
  <link rel="stylesheet" href="/static/css/material3.css">
  <link rel="stylesheet" href="/static/css/map.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d11;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #0b0d11;
    }

    /* Floating Header Overlay */
    .admin-map-top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 1500;
    }

    .admin-map-top-bar > * {
      pointer-events: auto;
    }

    .admin-live-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(18, 20, 26, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 6px 14px;
      border-radius: var(--md-shape-full);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      font-size: 13px;
      color: #ffffff;
      font-weight: 500;
    }

    .admin-live-badge .stat-strong {
      font-weight: 700;
      color: #ffffff;
    }

    .admin-live-badge .divider {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.18);
    }

    .admin-top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--md-shape-sm);
      background: rgba(18, 20, 26, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .admin-icon-btn:hover {
      background: rgba(35, 40, 52, 0.98);
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
      transform: scale(1.05);
    }

    /* Recenter Floating Pill Bar */
    .admin-recenter-container {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      z-index: 1500;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s cubic-bezier(0.2, 0, 0, 1), transform 0.25s cubic-bezier(0.2, 0, 0, 1), visibility 0.25s;
    }

    .admin-recenter-container.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    /* Car Marker */
    .car-marker-container {
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .car-marker-icon {
      width: 44px;
      height: 44px;
      transform-origin: center center;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
      will-change: transform;
    }

    /* Destination Marker with pulsating ring */
    .dest-marker-container {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dest-pin {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #e82127;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 12px rgba(232, 33, 39, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .dest-halo {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(232, 33, 39, 0.4);
      animation: pulseGlow 1.8s infinite ease-out;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Fullscreen / Embedded Map Canvas -->
  <div id="map"></div>

  <!-- Top Controls & Telemetry Overlay -->
  <div class="admin-map-top-bar">
    <div class="admin-live-badge" id="admin-live-badge">
      <span class="pulse-dot"></span>
      <span id="badge-speed"><strong class="stat-strong">--</strong> km/h</span>
      <span class="divider"></span>
      <span id="badge-battery"><strong class="stat-strong">--</strong>%</span>
      <span class="divider" id="badge-dest-sep" style="display: none;"></span>
      <span id="badge-dest" style="display: none; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #93c5fd; font-weight: 600;"></span>
    </div>

    <div class="admin-top-actions">
      <button type="button" class="admin-icon-btn" id="btn-fullscreen-toggle" title="Plein écran">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Recenter Navigation Floating Pill Bar -->
  <div id="recenter-bar-container" class="admin-recenter-container">
    <button id="recenter-btn" class="recenter-pill-btn" type="button">
      <svg class="recenter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="7"></circle>
        <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
        <line x1="12" y1="1" x2="12" y2="5"></line>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="1" y1="12" x2="5" y2="12"></line>
        <line x1="19" y1="12" x2="23" y2="12"></line>
      </svg>
      <span data-i18n="recenter">Recentrer</span>
    </button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script>
    window.TESLAMAP_TILE_URL = "{{.TileURL}}";
    window.TESLAMAP_ATTRIBUTION = {{.Attribution}};
    window.TESLAMAP_MAX_ZOOM = {{.MaxZoom}};
  </script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/admin_map.js"></script>
</body>
</html>
