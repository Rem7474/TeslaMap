<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeslaMap Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
  <link rel="stylesheet" href="/static/css/material3.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      background: radial-gradient(circle at 50% 20%, var(--md-sys-color-surface-container) 0%, var(--md-sys-color-background) 75%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 36px 30px;
      border-radius: var(--md-shape-xl);
      box-shadow: var(--md-sys-elevation-3);
    }
  </style>
</head>
<body>

  <div class="m3-card login-card">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
      <div class="lang-selector" style="display: flex; gap: 2px; background: var(--md-sys-color-surface-container-high); padding: 3px; border-radius: var(--md-shape-full); border: 1px solid var(--md-sys-color-outline-variant);">
        <button type="button" class="lang-toggle-btn m3-button m3-button-text" data-lang="fr" onclick="I18n.setLang('fr')" style="height: 26px; padding: 0 10px; font-size: 11px; font-weight: 700; border-radius: var(--md-shape-full);">FR</button>
        <button type="button" class="lang-toggle-btn m3-button m3-button-text" data-lang="en" onclick="I18n.setLang('en')" style="height: 26px; padding: 0 10px; font-size: 11px; font-weight: 700; border-radius: var(--md-shape-full);">EN</button>
      </div>
    </div>

    <div style="text-align: center; margin-bottom: 28px;">
      <svg width="52" height="52" viewBox="0 0 48 48">
        <rect x="15" y="12" width="18" height="28" rx="6" fill="#1e2229" stroke="#e82127" stroke-width="3"/>
        <circle cx="17.5" cy="13.5" r="2" fill="#ffffff"/>
        <circle cx="30.5" cy="13.5" r="2" fill="#ffffff"/>
      </svg>
      <h1 class="m3-title-large" style="margin-top: 14px; color: #ffffff;" data-i18n="login_title">TeslaMap Admin</h1>
      <p class="m3-body-small" style="color: var(--md-sys-color-on-surface-variant); margin-top: 6px;" data-i18n="login_subtitle">
        Veuillez saisir votre mot de passe administrateur
      </p>
    </div>

    <form id="login-form">
      <div class="m3-field">
        <label for="password" data-i18n="password">Mot de passe</label>
        <input type="password" id="password" class="m3-input" required placeholder="••••••••">
      </div>

      <div id="login-error" style="display: none; color: var(--md-sys-color-error); font-size: 13px; margin-bottom: 16px;" data-i18n="login_error">
        Mot de passe incorrect.
      </div>

      <button type="submit" class="m3-button m3-button-tesla" style="width: 100%; height: 44px;" data-i18n="login_btn">
        <span class="material-symbols-outlined" style="font-size: 18px;">lock</span>
        <span>Se connecter</span>
      </button>
    </form>
  </div>

  <script src="/static/js/i18n.js?v=1.0.40"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const pwd = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });
        if (res.ok) {
          window.location.href = '/admin';
        } else {
          errEl.style.display = 'block';
        }
      } catch (err) {
        alert("Server error");
      }
    });
  </script>
</body>
</html>
